<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding Access — Preview</title>
  <link rel="stylesheet" href="../wordpress/wp-content/plugins/interactive-employee-onboarding-demo/assets/css/onboarding.css">
</head>
<body class="ieod-site">
<main class="ieod-gate">
  <div class="ieod-gate-brand"><span>O</span> ONBOARD</div>
  <section class="ieod-gate__card">
    <p class="ieod-eyebrow">PRIVATE DEMO</p>
    <h1>Self-Guided Onboarding</h1>
    <p>Enter a demo password to open the employee or guest flow.</p>
    <form class="ieod-gate__form">
      <label for="pw">Password</label>
      <input id="pw" type="password" value="demo123">
      <button class="ieod-btn ieod-btn--primary" type="button">Unlock</button>
    </form>
    <details><summary>Demo access</summary><p><code>demo123</code> · employee &nbsp; <code>guest123</code> · guest</p></details>
  </section>
</main>
</body>
</html>
